<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
  <title>GRID</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <span class="hud-group"><span id="score-b">0</span><button id="wall-button-b" class="wall-button" type="button">Move Wall</button></span>
    <span id="hud-center">
      <span id="turn-clock">20</span>
      <span id="match-clock">5:00</span>
    </span>
    <span class="hud-group"><button id="wall-button-a" class="wall-button" type="button">Move Wall</button><span id="score-a">0</span></span>
  </div>
  <div id="goal-popup">GOAL — <span id="goal-score-a"></span>–<span id="goal-score-b"></span></div>
  <div id="win-overlay">
    <p id="win-message"></p>
    <div class="win-actions">
      <button id="play-again" type="button">Play again</button>
      <button id="change-field" type="button">Change field</button>
    </div>
  </div>
  <div id="turn-prompt">Place your wall — or just take your shot</div>
  <div id="wall-controls">
    <button id="wall-cancel" type="button">Cancel</button>
    <button id="wall-remove" type="button">Remove</button>
    <button id="wall-rotate" type="button">Rotate</button>
    <button id="wall-confirm" type="button">Confirm</button>
  </div>
  <div id="mode-picker">
    <p>Choose a field</p>
    <div class="mode-picker-options">
      <div class="mode-option">
        <button id="mode-arena" type="button">ARENA</button>
        <p class="mode-desc">Solid edges — the ball bounces off everything except the goals.</p>
      </div>
      <div class="mode-option">
        <button id="mode-void" type="button">VOID</button>
        <p class="mode-desc">No edges — drift off the field and your opponent scores.</p>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
